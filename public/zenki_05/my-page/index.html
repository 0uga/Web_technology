<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介サイト</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>My Profile</h1>
        <p>Web Engineer / Student</p>
    </header>

    <section class="profile">
        <img src="https://via.placeholder.com/180" alt="プロフィール画像">

        <div>
            <h2>自己紹介</h2>
            <p>
                こんにちは！私はWeb開発に興味がある学生です。
                JavaScriptやPythonを使った開発を勉強しています。
            </p>
        </div>
    </section>

    <section class="skills">
        <h2>スキル</h2>

        <ul>
            <li>HTML / CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
            <li>TypeScript</li>
        </ul>
    </section>

    <section class="hobby">
        <h2>趣味</h2>
        <p>ゲーム、アニメ、Web制作、プログラミング</p>
    </section>

    <button id="themeButton">テーマ変更</button>

    <script src="./js/script.js"></script>
</body>
